[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-retrieval"
version = "0.2.0"
description = "Reproducible hypothesis-driven investigation experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
beyond-retrieval = "beyond_retrieval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beyond_retrieval = ["results_ui.html"]
