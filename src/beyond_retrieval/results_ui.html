<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beyond Retrieval — Tables 6–12</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --fg: #1c1b19;
      --muted: #5c5954;
      --line: #d9d5ce;
      --card: #ffffff;
      --accent: #0b5fff;
      --pending: #8a6d1d;
      --filled: #1f6b3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    header {
      padding: 20px 24px 8px;
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 650; }
    .meta { color: var(--muted); font-size: 13px; }
    .stats {
      display: flex; gap: 16px; flex-wrap: wrap;
      padding: 12px 24px; color: var(--muted); font-size: 13px;
    }
    .stats strong { color: var(--fg); }
    .study {
      margin: 0 24px 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      font-size: 13px;
    }
    .study dt {
      color: var(--muted);
      font-weight: 600;
      margin: 0 0 2px;
    }
    .study dd {
      margin: 0 0 10px;
    }
    .study dd:last-child { margin-bottom: 0; }
    .scope {
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 12px;
    }
    nav {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 8px 24px 16px; background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    button.tab {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--fg);
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
    }
    button.tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    main { padding: 20px 24px 48px; max-width: 1200px; }
    .panel { display: none; }
    .panel.active { display: block; }
    h2 { margin: 0 0 6px; font-size: 18px; }
    .caption { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th {
      font-size: 12px;
      text-transform: none;
      letter-spacing: 0;
      color: var(--muted);
      background: #faf9f7;
      position: sticky;
      top: 0;
    }
    tr:last-child td { border-bottom: 0; }
    td.dash { color: #9a958c; }
    td.pending { color: var(--pending); }
    td.filled { color: var(--filled); font-variant-numeric: tabular-nums; }
    .note {
      margin-top: 16px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #faf9f7;
      color: var(--muted);
      font-size: 13px;
    }
    .err {
      margin: 24px;
      padding: 12px;
      border: 1px solid #e0b4b4;
      background: #fff5f5;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Beyond Retrieval — result tables 6–12</h1>
    <div class="meta" id="subtitle">Loading experiment results…</div>
  </header>
  <div class="stats" id="stats"></div>
  <dl class="study" id="study"></dl>
  <nav id="tabs"></nav>
  <main id="main"></main>

  <script src="data.js"></script>
  <script>
    const DASH = "—";

    function cellClass(text) {
      if (!text || text === DASH) return "dash";
      if (String(text).includes("(pending)")) return "pending";
      return "filled";
    }

    function render(data) {
      document.getElementById("subtitle").textContent =
        data.paper + " · generated " + (data.generated_at || "—");
      document.getElementById("stats").innerHTML =
        "<span><strong>" + (data.run_count || 0) + "</strong> ledger runs</span>" +
        "<span><strong>7</strong> tables</span>" +
        "<span>auto-refresh 5s</span>";
      document.getElementById("study").innerHTML =
        "<dt>Models tested</dt><dd>" + escapeHtml(data.models_label || DASH) + "</dd>" +
        "<dt>Data used</dt><dd>" + escapeHtml(data.data_label || DASH) + "</dd>";

      const order = ["6", "7", "8", "9", "10", "11", "12"];
      const tabs = document.getElementById("tabs");
      const main = document.getElementById("main");
      tabs.innerHTML = "";
      main.innerHTML = "";

      order.forEach((id, idx) => {
        const t = data.tables[id];
        if (!t) return;
        const btn = document.createElement("button");
        btn.className = "tab" + (idx === 0 ? " active" : "");
        btn.textContent = "Table " + id;
        btn.onclick = () => {
          document.querySelectorAll("button.tab").forEach((b) => b.classList.remove("active"));
          document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById("panel-" + id).classList.add("active");
        };
        tabs.appendChild(btn);

        const panel = document.createElement("section");
        panel.className = "panel" + (idx === 0 ? " active" : "");
        panel.id = "panel-" + id;
        const rows = (t.rows || []).map((row) => {
          const cells = row.map((c, i) => {
            const text = c == null || c === "" ? DASH : String(c);
            const cls = i === 0 ? "" : cellClass(text);
            return "<td class=\"" + cls + "\">" + escapeHtml(text) + "</td>";
          }).join("");
          return "<tr>" + cells + "</tr>";
        }).join("");
        panel.innerHTML =
          "<h2>Table " + id + ". " + escapeHtml(t.title) + "</h2>" +
          "<p class=\"caption\">" + escapeHtml(t.caption || "") + "</p>" +
          "<p class=\"scope\"><strong>Models:</strong> " + escapeHtml(t.models_label || DASH) +
          " &nbsp;·&nbsp; <strong>Data:</strong> " + escapeHtml(t.data_label || DASH) + "</p>" +
          "<div class=\"table-wrap\"><table><thead><tr>" +
          (t.headers || []).map((h) => "<th>" + escapeHtml(h) + "</th>").join("") +
          "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
          (data.note ? "<div class=\"note\">" + escapeHtml(data.note) + "</div>" : "");
        main.appendChild(panel);
      });
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;");
    }

    async function load() {
      let data = window.RESULTS;
      try {
        const res = await fetch("data.json", { cache: "no-store" });
        if (res.ok) data = await res.json();
      } catch (_) { /* file:// fallback uses data.js */ }
      if (!data || !data.tables) {
        document.getElementById("main").innerHTML =
          "<div class=\"err\">No results yet. Run <code>beyond-retrieval report</code> or <code>beyond-retrieval demo</code>.</div>";
        return;
      }
      window.RESULTS = data;
      render(data);
    }

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
